name: Heyo
description: Heyo is a social marketing platform for building and running online promotions
  such as sweepstakes, contests, giveaways, quizzes, and coupons. Businesses use Heyo's
  drag-and-drop campaign builder and landing pages to create interactive campaign apps
  that publish to the web, mobile, and social networks including Facebook, Instagram, and
  Twitter. It is used to grow email marketing lists, generate sales leads, acquire new
  customers, reward existing customers, and increase social followers, with templated
  promotion apps and a free trial. Heyo is a portfolio company of 500 Global and was
  acquired by Votigo, Inc. in January 2016, continuing to operate as a stand-alone
  self-serve brand. Heyo publishes no public API, SDK or developer portal; the product
  is used entirely through the web dashboard at platform.heyo.com.
